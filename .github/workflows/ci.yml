name: Build and test
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm test包含ZIP解压、清单和逐文件SHA256检查，不调用模型或真实宿主。
      - run: npm test
      - run: npm run check:build
