# 先通过宿主安装harness/bundle，完整重启后由提示词加载。
# 已有agent-team服务时使用现有行；默认模式由主插件准备计划后维护HTML。
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
- id: dynamic-task-scheduler
  disabled: false
  config:
    onDemand: true
    leadSessionId: auto
